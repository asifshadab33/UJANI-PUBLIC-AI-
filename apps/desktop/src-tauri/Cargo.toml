[package]
name = "ujani-desktop"
version = "0.1.0"
description = "UJANI Public AI desktop application"
authors = ["UJANI contributors"]
edition = "2021"

[lib]
name = "ujani_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.30"
sys-locale = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
pdf-extract = "0.7"
tokio = { version = "1", features = ["time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ujani-core = { path = "../../../crates/ujani-core" }

# Keep the Tauri application in its own workspace; the shared core crate is a path dependency.
[workspace]
