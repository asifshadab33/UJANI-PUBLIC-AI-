[package]
name = "ujani-desktop"
version = "0.1.0"
description = "UJANI Public AI desktop application"
license = "GPL-3.0-only"
authors = ["UJANI contributors"]
edition = "2021"

[features]
# Peer identity/envelope IPC remains disabled until a real authenticated transport ships.
default = []
peer-preview = []

[lib]
name = "ujani_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = "0.8"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust", "vendored"] }
base64 = "0.22"
sysinfo = "0.30"
sys-locale = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
pdf-extract = "0.12.1"
tokio = { version = "1", features = ["time", "rt", "sync", "net", "macros", "process", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
zeroize = "1"
ed25519-dalek = "3"
ujani-core = { path = "../../../crates/ujani-core" }

# Keep the Tauri application in its own workspace; the shared core crate is a path dependency.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_Storage_FileSystem"] }

[workspace]
