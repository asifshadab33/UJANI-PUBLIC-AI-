[package]
name = "ujani-parser-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ujani-core = { path = "../crates/ujani-core" }
pdf-extract = "0.7"

[[bin]]
name = "image_header"
path = "fuzz_targets/image_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pdf_text"
path = "fuzz_targets/pdf_text.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
