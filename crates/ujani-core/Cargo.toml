[package]
name = "ujani-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Initial task and capability contracts for UJANI Public AI"

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "3"
sha2 = "0.10"
