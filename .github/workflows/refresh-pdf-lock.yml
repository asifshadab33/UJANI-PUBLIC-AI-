name: Refresh desktop PDF lockfile

on:
  push:
    branches:
      - security/upgrade-pdf-parser-dependencies

permissions:
  contents: write

jobs:
  refresh-lock:
    if: "!contains(github.event.head_commit.message, 'chore: refresh desktop PDF lockfile')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Resolve the patched PDF dependency graph
        run: cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml -p pdf-extract --precise 0.12.1
      - name: Commit the generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "chore: refresh desktop PDF lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
