name: UJANI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run the full validation suite nightly (UTC); pull requests and main pushes remain immediate.
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest CI run for a branch; superseded commits are not release candidates.
concurrency:
  group: ${{ github.event_name == 'schedule' && format('ujani-ci-schedule-{0}', github.run_id) || format('ujani-ci-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install pinned JSON Schema validation dependencies
        run: python -m pip install --disable-pip-version-check --no-input --requirement scripts/requirements-schema.txt
      - name: Check documentation claims against protocol version
        run: bash scripts/check-doc-claims.sh
      - name: Test external assistance consent gate
        run: python3 -m unittest discover -s tests -p 'test_external_assistance_policy.py' -v
      - name: Check native IPC command inventory parity
        run: python3 scripts/check_native_command_inventory.py
      - name: Validate model/runtime inventory v1 schema
        run: python3 scripts/validate_model_runtime_inventory_schema.py
      - name: Validate Personal-to-Enterprise task contract v1
        run: python3 scripts/validate_personal_enterprise_task_contract.py
      - name: Run workspace tests
        run: cargo test --workspace --locked

  desktop-native-check:
    name: Tauri native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install frontend and Tauri CLI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Generate Tauri platform icons from the checked-in SVG
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/ujani.svg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Build and stage the PDF worker sidecar for native checks
        working-directory: apps/desktop
        run: npm run build:pdf-worker
      - name: Check desktop Rust application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Check opt-in peer preview feature
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features peer-preview --locked
      - name: Run desktop native unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked
      - name: Run dedicated PDF worker regression tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --bin ujani-pdf-worker --features pdf-worker-build --locked

  dependency-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit locked workspace dependencies
        run: cargo audit
      - name: Audit locked desktop dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  rust-quality:
    name: Rust lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install frontend and Tauri CLI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Generate Tauri platform icons from the checked-in SVG
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/ujani.svg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy
      - name: Install Linux desktop lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Build and stage the PDF worker sidecar for desktop lint
        working-directory: apps/desktop
        run: npm run build:pdf-worker
      - name: Lint core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint desktop
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --features pdf-worker-build --locked -- -D warnings

  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require version-bound updater signatures
        run: grep -Eq '"requireSignedVersion"[[:space:]]*:[[:space:]]*true' apps/desktop/src-tauri/tauri.conf.json
      - name: Reject updater artifacts until a non-empty signing public key is configured
        run: |
          node -e "const c=require('./apps/desktop/src-tauri/tauri.conf.json'); if (c.bundle.createUpdaterArtifacts && !c.plugins?.updater?.pubkey?.trim()) { console.error('Updater artifacts require a configured signing public key.'); process.exit(1); }"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache: false
      - name: Lint all GitHub Actions workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  frontend-dependency-audit:
    name: Frontend dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Audit frontend runtime and development dependencies
        working-directory: apps/desktop
        run: npm audit --audit-level=high

  frontend-build:
    name: React TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Type-check and build frontend
        working-directory: apps/desktop
        run: npm run build
