name: UJANI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep only the newest CI run for a branch; superseded commits are not release candidates.
concurrency:
  group: ujani-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run workspace tests
        run: cargo test --locked --workspace

  desktop-native-check:
    name: Tauri native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Check desktop Rust application
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Run desktop native unit tests
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

  frontend-build:
    name: React TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Type-check and build frontend
        working-directory: apps/desktop
        run: npm run build
