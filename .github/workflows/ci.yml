name: UJANI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Repeat the complete validation suite every 30 minutes (UTC).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest CI run for a branch; superseded commits are not release candidates.
concurrency:
  group: ujani-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Check documentation claims against protocol version
        run: bash scripts/check-doc-claims.sh
      - name: Run workspace tests
        run: cargo test --workspace --locked

  desktop-native-check:
    name: Tauri native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install frontend and Tauri CLI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Generate Tauri platform icons from the checked-in SVG
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/ujani.svg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Check desktop Rust application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Run desktop native unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked

  rust-quality:
    name: Rust lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install frontend and Tauri CLI dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Generate Tauri platform icons from the checked-in SVG
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/ujani.svg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy
      - name: Install Linux desktop lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Lint core
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Lint desktop
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings

  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require version-bound updater signatures
        run: grep -Eq '"requireSignedVersion"[[:space:]]*:[[:space:]]*true' apps/desktop/src-tauri/tauri.conf.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.0"
          cache: false
      - name: Lint all GitHub Actions workflow files
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  frontend-build:
    name: React TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Type-check and build frontend
        working-directory: apps/desktop
        run: npm run build
