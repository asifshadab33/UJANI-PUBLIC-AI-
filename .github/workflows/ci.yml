name: UJANI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Keep only the newest CI run for a branch; superseded commits are not release candidates.
concurrency:
  group: ujani-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Rust core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Check documentation claims against protocol version
        run: bash scripts/check-doc-claims.sh
      - name: Run workspace tests
        run: cargo test --workspace

  desktop-native-check:
    name: Tauri native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install frontend and Tauri CLI dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Generate Tauri platform icons from the checked-in SVG
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/ujani.svg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - name: Install Tauri Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Check desktop Rust application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Run desktop native unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

  rust-quality:
    name: Rust lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install frontend and Tauri CLI dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Generate Tauri platform icons from the checked-in SVG
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/ujani.svg
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy
      - name: Install Linux desktop lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - name: Lint core
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lint desktop
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

  frontend-build:
    name: React TypeScript build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Type-check and build frontend
        working-directory: apps/desktop
        run: npm run build

  generate-lockfiles:
    name: Generate and commit dependency lockfiles
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve frontend dependencies without running install scripts
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Generate Rust workspace lockfiles
        run: |
          cargo generate-lockfile --manifest-path Cargo.toml
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit generated lockfiles to this same-repository PR branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/package-lock.json Cargo.lock apps/desktop/src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "chore: commit generated dependency lockfiles"
          git push origin "HEAD:${HEAD_REF}"
