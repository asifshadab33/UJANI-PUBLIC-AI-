name: UJANI installer size audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ujani-installer-size-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-installers:
    name: Build installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi,nsis
          - platform: macos-latest
            bundles: dmg
          - platform: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev patchelf xdg-utils
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Generate platform installer icons
        working-directory: apps/desktop
        run: npm run tauri icon src-tauri/icons/ujani.svg
      - name: Build and stage the dedicated PDF worker sidecar
        working-directory: apps/desktop
        run: npm run build:pdf-worker
      - name: Disable updater signing artifacts for unsigned size measurement
        working-directory: apps/desktop/src-tauri
        run: node -e "const fs=require('fs');const p='tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.bundle.createUpdaterArtifacts=false;fs.writeFileSync(p,JSON.stringify(c,null,2));"
      - name: Verify desktop dependency resolution with the committed lockfile
        shell: bash
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --format-version 1 --locked
      - name: Build native installer bundles
        working-directory: apps/desktop
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Report exact installer sizes
        working-directory: apps/desktop
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'src-tauri/target/release/bundle';
          const allowed = new Set(['.msi', '.exe', '.dmg', '.deb', '.appimage']);
          const found = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (allowed.has(path.extname(entry.name).toLowerCase())) {
                const bytes = fs.statSync(full).size;
                found.push({ name: path.relative(root, full), bytes, mib: (bytes / 1048576).toFixed(2) });
              }
            }
          }
          walk(root);
          if (!found.length) { console.error('No installer bundles were produced.'); process.exit(1); }
          found.sort((a, b) => a.name.localeCompare(b.name));
          const rows = ['| Installer | Bytes | MiB |', '|---|---:|---:|'];
          for (const f of found) rows.push(`| ${f.name} | ${f.bytes} | ${f.mib} |`);
          console.log(rows.join('\n'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `\n## ${process.env.RUNNER_OS} installer sizes\n\n${rows.join('\n')}\n`);
          NODE
      - name: Collect unsigned preview installers and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { spawnSync } = require('child_process');
          const root = 'apps/desktop/src-tauri/target/release/bundle';
          const output = 'preview-installers';
          const allowed = new Set(['.msi', '.exe', '.dmg', '.deb', '.appimage']);
          fs.mkdirSync(output, { recursive: true });
          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (allowed.has(path.extname(entry.name).toLowerCase())) files.push(full);
            }
          }
          walk(root);
          if (!files.length) throw new Error('No installer bundles found to upload.');
          for (const file of files) {
            const name = path.basename(file);
            const isAppImage = path.extname(name).toLowerCase() === '.appimage';
            const destination = path.join(output, isAppImage ? name + '.tar.gz' : name);
            if (fs.existsSync(destination)) throw new Error('Duplicate installer filename: ' + path.basename(destination));
            if (isAppImage) {
              // GitHub artifact ZIPs do not preserve POSIX executable bits.
              // Put AppImage inside tar.gz so its mode survives artifact download.
              fs.chmodSync(file, fs.statSync(file).mode | 0o111);
              const archived = spawnSync('tar', ['-C', path.dirname(file), '-czf', path.resolve(destination), name], { stdio: 'inherit' });
              if (archived.error || archived.status !== 0) throw archived.error || new Error('Could not archive AppImage with its executable mode.');
            } else {
              fs.copyFileSync(file, destination);
            }
          }
          const names = fs.readdirSync(output).filter(name => name !== 'SHA256SUMS').sort();
          const hashFile = file => new Promise((resolve, reject) => {
            const hash = crypto.createHash('sha256');
            const stream = fs.createReadStream(file);
            stream.on('data', chunk => hash.update(chunk));
            stream.on('error', reject);
            stream.on('end', () => resolve(hash.digest('hex')));
          });
          (async () => {
            const sums = [];
            for (const name of names) sums.push(await hashFile(path.join(output, name)) + '  ' + name);
            fs.writeFileSync(path.join(output, 'SHA256SUMS'), sums.join('\n') + '\n');
            fs.writeFileSync(path.join(output, 'README.txt'), [
              'UJANI unsigned preview installers',
              'These builds are for controlled testing only and are not publisher-signed.',
              'Verify SHA256SUMS with sha256sum -c SHA256SUMS (Linux), shasum -a 256 -c SHA256SUMS (macOS), or compare each file with Get-FileHash -Algorithm SHA256 (Windows).',
              'Linux AppImage is packaged as .tar.gz to preserve its executable permission; extract it before running.'
            ].join(String.fromCharCode(10)) + String.fromCharCode(10));
            console.log('Collected ' + names.length + ' installer package(s) with streaming SHA-256 checksums.');
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        name: Upload unsigned preview installers
        with:
          name: ujani-${{ runner.os }}-unsigned-preview-installers
          path: preview-installers/*
          if-no-files-found: error
          retention-days: 14
