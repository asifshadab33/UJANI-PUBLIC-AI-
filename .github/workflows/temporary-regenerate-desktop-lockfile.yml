name: Temporary desktop lockfile regeneration

on:
  push:
    branches:
      - security/upgrade-rusqlite-041

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Regenerate only the rusqlite dependency graph
        working-directory: apps/desktop/src-tauri
        run: cargo update -p rusqlite@0.31.0
      - name: Verify the regenerated lockfile is consumable in locked mode
        run: cargo metadata --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Commit only the regenerated desktop lockfile
        run: |
          if git diff --quiet -- apps/desktop/src-tauri/Cargo.lock; then
            echo "Desktop lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "fix(deps): regenerate desktop lockfile for patched SQLite"
          git push origin "HEAD:$GITHUB_REF_NAME"
