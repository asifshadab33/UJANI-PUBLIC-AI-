name: Rust dependency security audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'schedule' && format('rustsec-schedule-{0}', github.run_id) || format('rustsec-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: RustSec advisory audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit committed dependency lockfile
        run: cargo audit --file Cargo.lock
