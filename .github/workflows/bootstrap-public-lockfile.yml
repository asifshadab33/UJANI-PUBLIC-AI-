name: Bootstrap Public filesystem dependency lockfile (temporary)

on:
  push:
    branches:
      - fix/408-handle-relative-directory-walker-2026-11-25

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor == 'asifshadab33'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - name: Resolve and commit the reproducible workspace lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
          if ! git diff --quiet -- apps/desktop/src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/desktop/src-tauri/Cargo.lock
            git commit -m "chore: regenerate desktop Cargo.lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
