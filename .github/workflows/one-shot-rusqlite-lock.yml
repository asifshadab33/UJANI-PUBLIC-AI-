name: One-shot rusqlite lockfile remediation

on:
  push:
    branches:
      - security/upgrade-rusqlite-041
    paths:
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/src/lib.rs
      - .github/workflows/one-shot-rusqlite-lock.yml

permissions:
  contents: write

concurrency:
  group: rusqlite-lock-remediation
  cancel-in-progress: false

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          components: clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev librsvg2-bin icnsutils libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Regenerate desktop lockfile for maintained rusqlite
        run: cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml -p rusqlite --precise 0.41.0
      - name: Generate missing Tauri platform icons from the checked-in SVG
        working-directory: apps/desktop/src-tauri
        run: |
          rsvg-convert -w 32 -h 32 icons/ujani.svg > icons/32x32.png
          rsvg-convert -w 128 -h 128 icons/ujani.svg > icons/128x128.png
          rsvg-convert -w 256 -h 256 icons/ujani.svg > icons/128x128@2x.png
          png2icns icons/icon.icns icons/128x128.png icons/128x128@2x.png
      - name: Build PDF worker sidecar with regenerated lockfile
        working-directory: apps/desktop
        run: npm run build:pdf-worker
      - name: Verify SQLite FFI version
        run: cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml -i libsqlite3-sys
      - name: Check formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Check desktop application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Check peer preview feature
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --features peer-preview --locked
      - name: Run desktop native unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib --locked
      - name: Run PDF worker regression tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --bin ujani-pdf-worker --features pdf-worker-build --locked
      - name: Run desktop Clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --features pdf-worker-build --locked -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit desktop lockfile
        working-directory: apps/desktop/src-tauri
        run: cargo audit
      - name: Commit validated lockfile and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-rusqlite-lock.yml
          git add apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/icons/32x32.png apps/desktop/src-tauri/icons/128x128.png apps/desktop/src-tauri/icons/128x128@2x.png apps/desktop/src-tauri/icons/icon.icns
          git commit -m "fix(deps): update rusqlite and bundled SQLite security fixes"
          git push origin "HEAD:${GITHUB_REF_NAME}"
