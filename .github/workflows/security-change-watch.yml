name: Security-sensitive change watch

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  inspect-sensitive-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Flag security-sensitive file changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          # Check both sides of renames so moving a protected file cannot hide it.
          files="$(gh api --paginate "repos/${GH_REPO}/pulls/${PR_NUMBER}/files" --jq '.[] | [.filename, .previous_filename // empty] | .[]')"
          pattern='(^\.github/workflows/|(^|/)CODEOWNERS$|(^|/)(Cargo\.toml|Cargo\.lock|package\.json|package-lock\.json|pnpm-lock\.yaml|yarn\.lock)$|(^|/)capabilities/|(^|/)(tauri\.conf\.json|SECURITY\.md|THREAT-MODEL\.md|RELEASE-GATES\.md)$|(^|/)(updater|signing|certificates?)/|(^|/)(security|auth|crypto|policy|consent|safe_fs|cloud_gateway|device_identity|task_engine|native_consent|ollama)\.rs$|(^|/)schemas/|(^|/)docs/)'

          matched="$(printf '%s\n' "$files" | grep -E "$pattern" || true)"
          {
            echo "### UJANI security-sensitive change watch"
            if [[ -z "$matched" ]]; then
              echo "No paths matched the current security-sensitive path rules."
              echo "This is a path-based triage check, not a security audit."
            else
              echo "**Review required:** security-sensitive paths changed."
              echo
              printf '%s\n' "$matched"
              echo
              echo "This check does not establish whether a change is malicious or safe."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "$matched" ]]; then
            echo "::warning title=Security-sensitive paths changed::Inspect the matched files and obtain appropriate independent security review."
          fi
